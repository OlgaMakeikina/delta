<!DOCTYPE html>
<html lang="ru">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>404 — Страница не найдена | АО "Дельта"</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
      <style>
         * { margin: 0; padding: 0; box-sizing: border-box; }

         body {
            font-family: "Roboto", sans-serif;
            background-color: #f3f5fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
         }

         header {
            background: linear-gradient(to bottom, #11468F, #0E2F56);
            padding: 16px 32px;
         }

         header a img {
            width: 80px;
         }

         .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
         }

         .code {
            font-size: 120px;
            font-weight: 700;
            color: #11468F;
            line-height: 1;
            margin-bottom: 16px;
         }

         .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(to right, #11468F, #DA1212);
            margin: 0 auto 24px;
         }

         .title {
            font-size: 28px;
            font-weight: 400;
            color: #0E2F56;
            margin-bottom: 12px;
         }

         .subtitle {
            font-size: 16px;
            font-weight: 300;
            color: #555;
            margin-bottom: 40px;
            max-width: 420px;
         }

         .btn {
            display: inline-block;
            padding: 14px 36px;
            background: linear-gradient(to bottom, #11468F, #0E2F56);
            color: #EEEEEE;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 2px;
            transition: opacity 0.2s ease;
         }

         .btn:hover {
            opacity: 0.85;
         }

         footer {
            background: linear-gradient(to bottom, #11468F, #0E2F56);
            color: #EEEEEE;
            text-align: center;
            padding: 16px;
            font-size: 13px;
            font-weight: 300;
         }

         footer a {
            color: #EEEEEE;
            text-decoration: none;
         }
      </style>
   </head>
   <body>
      <header>
         <a href="/"><img src="laibl.gif" alt="АО Дельта"></a>
      </header>

      <div class="container">
         <div class="code">404</div>
         <div class="divider"></div>
         <p class="title">Страница не найдена</p>
         <p class="subtitle">Возможно, она была перемещена или удалена. Вернитесь на главную страницу.</p>
         <a href="/" class="btn">На главную</a>
      </div>

      <footer>
         <p>Copyright © <span id="footer-year"></span>. АО "Дельта" (<a href="https://deltacompany.ru/">https://deltacompany.ru/</a>)</p>
         <p style="margin-top: 1.2em">Сайт разработан и сопровождается техническим партнёром&nbsp;— <a href="https://hhivp.ru/" target="_blank" rel="noopener">ООО «АйТи Решения»</a></p>
         <script>document.querySelectorAll('#footer-year, .footer-year').forEach(el => el.textContent = new Date().getFullYear());</script>
      </footer>
   </body>
</html>
